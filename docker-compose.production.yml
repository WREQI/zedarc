# Production overlay. Keep docker-compose.yml unchanged for local development.
services:
  web:
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR}/privkey.pem:/etc/nginx/tls/privkey.pem:ro
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
  api:
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SMS_PROVIDER: ${SMS_PROVIDER:?set SMS_PROVIDER=http}
      SMS_PROVIDER_URL: ${SMS_PROVIDER_URL:?set SMS_PROVIDER_URL}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:?set SMS_PROVIDER_API_KEY}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:?set SMS_TEMPLATE_ID}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: !reset []
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
